name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the selected commit)
        required: false
        type: string
      confirm:
        description: Type DEPLOY to confirm production deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY'
    name: Deploy selected revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: revision
        name: Resolve deployed revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: ci
        name: Reuse checks for the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          passed=false
          if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$DEPLOY_REVISION" -f event=push -f per_page=1 > "$RUNNER_TEMP/deploy-ci.json"; then
            if jq -e --arg sha "$DEPLOY_REVISION" '.workflow_runs[0] | .head_sha == $sha and .event == "push" and .conclusion == "success"' "$RUNNER_TEMP/deploy-ci.json" >/dev/null; then
              passed=true
            fi
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          if [ "$passed" = true ]; then
            echo 'Exact revision already passed CI; reusing lint, build and integration checks.'
          else
            echo 'No successful CI for this revision; running all checks before deployment.'
          fi

      - uses: actions/setup-node@v4
        if: steps.ci.outputs.passed != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.ci.outputs.passed != 'true'
      - run: npm run lint
        if: steps.ci.outputs.passed != 'true'
      - run: npm run build
        if: steps.ci.outputs.passed != 'true'
      - run: npm run test:integration
        if: steps.ci.outputs.passed != 'true'

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update application on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_REVISION='$DEPLOY_REVISION' bash -s" <<'REMOTE'
          set -euo pipefail
          test -d "$DEPLOY_PATH/.git"
          if ! sudo -n docker info >/dev/null 2>&1; then
            echo 'Deployment user needs passwordless sudo for /usr/bin/docker.' >&2
            exit 1
          fi
          cd "$DEPLOY_PATH"
          stage_start=$SECONDS
          for attempt in 1 2 3; do
            git fetch --prune origin && break
            test "$attempt" = 3 && exit 1
            sleep "$((attempt * 3))"
          done
          git checkout --detach --force "$DEPLOY_REVISION"
          echo "Source update: $((SECONDS - stage_start))s"
          echo 'Building with the server Docker cache'
          stage_start=$SECONDS
          sudo -n docker compose -f docker-compose.production.yml build
          echo "Image build: $((SECONDS - stage_start))s"
          stage_start=$SECONDS
          sudo -n docker compose -f docker-compose.production.yml up -d --no-build --force-recreate
          sleep 2
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8010/login >/dev/null
          echo "Restart and health check: $((SECONDS - stage_start))s"
          sudo -n docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          REMOTE


name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the selected commit)
        required: false
        type: string
      confirm:
        description: Type DEPLOY to confirm production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY'
    name: Deploy selected revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:integration

      - uses: docker/setup-buildx-action@v3

      - name: Build deploy image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: junyang-next:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package deploy image
        run: docker save "junyang-next:${{ github.sha }}" | gzip > /tmp/junyang-next-image.tar.gz

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer deploy image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          scp -i ~/.ssh/id_deploy -P "$DEPLOY_PORT" -o BatchMode=yes /tmp/junyang-next-image.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/junyang-next-$DEPLOY_REVISION.tar.gz"

      - name: Update application on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_REVISION='$DEPLOY_REVISION' bash -s" <<'REMOTE'
          set -euo pipefail
          test -d "$DEPLOY_PATH/.git"
          cd "$DEPLOY_PATH"
          git fetch --prune origin
          git checkout --detach --force "$DEPLOY_REVISION"
          sudo docker load --input "/tmp/junyang-next-$DEPLOY_REVISION.tar.gz"
          sudo docker tag "junyang-next:$DEPLOY_REVISION" junyang-next:latest
          sudo docker compose -f docker-compose.production.yml up -d --no-build --force-recreate
          curl --fail --silent --show-error --retry 10 --retry-delay 2 http://127.0.0.1:8010/login >/dev/null
          rm -f "/tmp/junyang-next-$DEPLOY_REVISION.tar.gz"
          REMOTE

